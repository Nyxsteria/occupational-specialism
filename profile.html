<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>

    <link rel="stylesheet" href="css/profile-page.css">

    <script src="scripts/script.js" defer></script>
    <script src="scripts/username-retrieve.js" defer></script>
</head>

<body>

    <header>
        <div class="header-container">

            <div class="site-title">
                <h1>
                    Your Profile,
                    <span id="username">.</span>
                </h1>
            </div>

            <nav>
                <ul class="navigator-menu">
                    <li><a class="nav-button">About</a></li>
                    <li><a class="nav-button">Contact</a></li>
                    <li><a class="nav-button">Resources</a></li>
                    <li><a class="nav-button">Home</a></li>
                    <li><img src="bell-image">Notifications</li>
                </ul>
            </nav>

        </div>
    </header>

    <main class="main-content">

        <div class="left-column">
            <img
                class="placeholder-img"
                src="images/placeholder.png"
                alt="Profile Placeholder">
        </div>

        <div class="right-column">

            <section class="dashboard">

                <p class="subtitle">WELCOME TO</p>

                <h1>Your Dashboard</h1>

                <div class="body-container">

                </div>

            </section>

            <section class="card-container">

                <div class="card">
                    <h2>About</h2>

                    <p>
                        Learn more about the Occupational
                        Specialism and its objectives.
                    </p>

                    <button id="openPopup">
                        Read More
                    </button>
                </div>

                <div class="card">
                    <h2>Contact</h2>

                    <p>
                        Find contact details and ways
                        to get in touch.
                    </p>

                    <button>
                        View Contact Information
                    </button>
                </div>

                <div class="card">
                    <h2>Home</h2>

                    <p>
                        Return to the homepage and
                        explore other sections.
                    </p>

                    <button>
                        Return To Home
                    </button>
                </div>

            </section>

        </div>

    </main>

    <footer>

    </footer>

</body>

</html>
