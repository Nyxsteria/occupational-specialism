<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login activity</title>
  <link rel="stylesheet" href="css/admin-panel.css">
</head>

<body>
  <main>
    <h1>Login activity</h1>
    <p><a href="admin-panel.php">Open the server-protected admin page</a></p>
    <button id="refresh" type="button">Refresh</button>
    <p id="message" role="status" aria-live="polite">Loading…</p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>User</th>
            <th>Event</th>
            <th>IP address</th>
            <th>Failure reason</th>
          </tr>
        </thead>
        <tbody id="events"></tbody>
      </table>
    </div>
  </main>

  <script>
    const message = document.querySelector('#message');
    const tableBody = document.querySelector('#events');

    async function loadEvents() {
      message.textContent = 'Loading…';
      tableBody.replaceChildren();

      try {
        // Endpoint is in the repository root beside this HTML file.
        const response = await fetch('./admin-auth-events.php', {
          credentials: 'same-origin',
          headers: { Accept: 'application/json' },
          cache: 'no-store'
        });

        if (response.status === 403) {
          message.textContent = 'Sign in with an admin account to view login activity.';
          return;
        }
        if (!response.ok) {
          throw new Error(`Server returned HTTP ${response.status}`);
        }

        const data = await response.json();
        if (!Array.isArray(data.events)) {
          throw new Error(data.error || 'Unexpected response from the server');
        }
        if (data.events.length === 0) {
          message.textContent = 'No authentication events found.';
          return;
        }

        for (const event of data.events) {
          const row = document.createElement('tr');
          const values = [
            event.event_timestamp,
            event.username || event.username_attempted,
            event.event_type,
            event.ip_address,
            event.failure_reason
          ];

          for (const value of values) {
            const cell = document.createElement('td');
            cell.textContent = value == null || value === '' ? '—' : String(value);
            row.appendChild(cell);
          }
          tableBody.appendChild(row);
        }

        message.textContent = `Showing ${data.events.length} recent events.`;
      } catch (error) {
        console.error('Could not load login activity:', error);
        message.textContent = 'Could not load login activity. Check the browser console and PHP/server error log.';
      }
    }

    document.querySelector('#refresh').addEventListener('click', loadEvents);
    loadEvents();
  </script>
</body>
</html>
