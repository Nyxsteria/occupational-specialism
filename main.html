<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Occupational Specialism</title>

    <link rel="stylesheet" href="styles.css">
    <script src="scripts/script.js" defer></script>
</head>

<body>

    <header>
        <div class="header-container">

            <div class="site-title">
                Occupational Specialism
            </div>

            <nav class="navigator-menu">
                <ul>
                    <li><button class="nav-button">About</button></li>
                    <li><button class="nav-button">Contact</button></li>
                    <li><button class="nav-button">Home</button></li>
                </ul>
            </nav>

        </div>
    </header>

    <main class="main-content">

        <div class="image-container">
            <img
                src="images/placeholder.png"
                alt="Placeholder image">
        </div>

        <section class="card-container">

            <div class="card">

                <h2>About</h2>

                <p>
                    Learn more about the Occupational Specialism and its objectives.
                </p>

                <button id="openPopup">
                    Read More
                </button>

            </div>

            <div class="card">

                <h2>Contact</h2>

                <p>
                    Find contact details and ways to get in touch.
                </p>

                <button>
                    View Contact Information
                </button>

            </div>

            <div class="card">

                <h2>Home</h2>

                <p>
                    Return to the homepage and explore other sections.
                </p>

                <button>
                    Return to Home
                </button>

            </div>

        </section>

    </main>

    <!-- JSON Driven Popup -->

    <div
        class="popup-overlay"
        id="popupOverlay"
        hidden>

        <section
            class="popup-card"
            role="dialog"
            aria-modal="true"
            aria-labelledby="popup-title"
            aria-describedby="popup-description">

            <button
                class="popup-close"
                id="popupClose"
                type="button"
                aria-label="Close popup">

                &times;

            </button>

            <h2 id="popup-title">
                Message Title
            </h2>

            <img
                class="popup-image"
                src="images/placeholder.png"
                alt="Popup image">

            <p id="popup-description">
                Message content will be loaded from JSON.
            </p>

            <!-- Generated by JavaScript -->

            <div id="popup-actions"></div>

        </section>

    </div>

    <footer>

    </footer>

</body>

</html>
