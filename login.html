<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Panel</title>

    <link rel="stylesheet" href="login-page.css">
    <script src="scripts/login.js" defer></script>
    <script src="scripts/username-retrieve.js" defer></script>
</head>

<body>

    <div class="login-container">

        <h1>Login</h1>

        <section class="login-form">

            <form id="login-form">

                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

        </section>

    </div>

</body>
</html>
